name: Build License Admin APK

on:
  push:
    branches: [ main ]
    paths: [ 'admin_app/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Admin APK (Universal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: Decode release keystore & create signing config
        env:
          ADMIN_KEYSTORE_B64: ${{ secrets.ADMIN_KEYSTORE_B64 }}
          ADMIN_KEYSTORE_PASSWORD: ${{ secrets.ADMIN_KEYSTORE_PASSWORD }}
          ADMIN_KEY_PASSWORD: ${{ secrets.ADMIN_KEY_PASSWORD }}
          ADMIN_KEY_ALIAS: ${{ secrets.ADMIN_KEY_ALIAS }}
        run: |
          DEFAULT_B64=""
          B64="${ADMIN_KEYSTORE_B64:-$DEFAULT_B64}"
          SPASS="${ADMIN_KEYSTORE_PASSWORD:-nexora2026}"
          KPASS="${ADMIN_KEY_PASSWORD:-nexora2026}"
          KALIAS="${ADMIN_KEY_ALIAS:-nexora-upload}"
          echo "$B64" | base64 -d > android/app/license-admin.jks
          cat > android/key.properties <<EOF
          storeFile=license-admin.jks
          storePassword=$SPASS
          keyPassword=$KPASS
          keyAlias=$KALIAS
          storeType=PKCS12
          EOF
          # تحقق مبكر: إن تعذّر فتح المفتاح نفشل هنا برسالة واضحة بدل فشل
          # غامض داخل Gradle («Given final block not properly padded»).
          keytool -list -v -keystore android/app/license-admin.jks \
            -storepass "$SPASS" -alias "$KALIAS" \
            | grep -E "Owner|Entry type"
          echo "تم تجهيز مفتاح التوقيع الثابت"

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure admin_updater.dart matches pubspec.yaml
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          NAME="${VER%%+*}"; BUILD="${VER##*+}"
          IFS='.' read -r MAJ MIN PAT <<< "$NAME"
          sed -i "s/const String kAdminAppVersion = .*/const String kAdminAppVersion = '$NAME';/" lib/admin_updater.dart
          sed -i "s/const int kAdminAppBuild = .*/const int kAdminAppBuild = $BUILD;/" lib/admin_updater.dart
          sed -i "s/AdminSemVer([0-9]*, [0-9]*, [0-9]*, kAdminAppBuild)/AdminSemVer($MAJ, $MIN, $PAT, kAdminAppBuild)/" lib/admin_updater.dart
          echo "Verified admin_updater.dart matches $NAME+$BUILD"

      - name: Run tests
        run: flutter test

      - name: Build APK (Universal)
        run: |
          # حزم مُقسّمة حسب المعالج (نحو نصف الحجم): الرابط المعتاد
          # license-admin.apk صار حزمة arm64 (أغلب الهواتف)، والبقية متاحة
          # بأسماء صريحة. التوقيع واحد ⇒ التحديث فوق النسخة السابقة يعمل.
          flutter build apk --release --split-per-abi --obfuscate \
            --split-debug-info=build/app/symbols \
            --dart-define=ADMIN_REFRESH_TOKEN=AMf-vBy0fav-UQVlyVGr4fVIz7H0VS-RlxLbzXMVDIwm7kGTfjxUeMAwe1tZkwKx_u8geyYdiETw6yW9i3hmja0oDP3wi_M47tVAS6qiASt88Uw73uQv7tANn3W60_WUodhrQTRxpdpCt4aBPN_vVyXra2jCbanZnWxlEcUTOvdSc9y3Ny2pQ6U
          cp build/app/outputs/apk/release/app-arm64-v8a-release.apk ../license-admin.apk
          cp build/app/outputs/apk/release/app-armeabi-v7a-release.apk ../license-admin-armv7.apk
          cp build/app/outputs/apk/release/app-x86_64-release.apk ../license-admin-x64.apk
          ls -lh ../license-admin.apk

      - name: Generate admin version manifest (admin_version.json)
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          NAME="${VER%%+*}"; BUILD="${VER##*+}"
          NOTES=$(python3 -c "import json,os; p='release_notes.txt'; lines=[l.strip() for l in open(p,encoding='utf-8').read().splitlines() if l.strip()] if os.path.exists(p) else ['تحديث تطبيق مدير التراخيص']; lines=lines[:3]; t='\\n'.join(lines); print(json.dumps(t,ensure_ascii=False)[1:-1])")
          cat > ../admin_version.json <<EOF
          {
            "version": "$NAME+$BUILD",
            "releaseUrl": "https://github.com/${{ github.repository }}/releases/tag/admin-latest",
            "downloads": {
              "android": "https://github.com/${{ github.repository }}/releases/download/admin-latest/license-admin.apk",
              "androidVariants": {
                "arm64": "https://github.com/${{ github.repository }}/releases/download/admin-latest/license-admin.apk",
                "armv7": "https://github.com/${{ github.repository }}/releases/download/admin-latest/license-admin-armv7.apk",
                "x64": "https://github.com/${{ github.repository }}/releases/download/admin-latest/license-admin-x64.apk"
              }
            },
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "$NOTES"
          }
          EOF
          cat ../admin_version.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: license-admin-apk
          path: |
            license-admin.apk
            license-admin-armv7.apk
            license-admin-x64.apk
            admin_version.json
          retention-days: 30

      - name: Attach to admin release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: admin-latest
          name: 🔑 مدير التراخيص — أحدث إصدار (للمالك فقط)
          body: |
            ## ⚠️ تطبيق خاص بمالك النظام فقط — لا يوزَّع للعملاء

            حمّل حزمة معالج هاتفك (أصغر بنحو الثلث من السابق):
            - `license-admin.apk` — **arm64** (معظم الهواتف الحديثة، ~16 MB).
            - `license-admin-armv7.apk` — الهواتف الأقدم 32-بت.
            - `license-admin-x64.apk` — محاكيات/أجهزة x86 النادرة.

            ثم اضبط رابط قاعدة البيانات من ⚙️ داخل التطبيق. التوقيع واحد
            لكل الحزم ⇒ التحديثات تُثبَّت فوق بعضها بلا حذف.
          files: |
            license-admin.apk
            license-admin-armv7.apk
            license-admin-x64.apk
            admin_version.json
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
