name: Build License Admin APK

on:
  push:
    branches: [ main ]
    paths:
      - 'admin_app/**'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Admin APK (arm64 + armv7)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: Decode release keystore & create signing config
        env:
          ADMIN_KEYSTORE_B64: ${{ secrets.ADMIN_KEYSTORE_B64 }}
          ADMIN_KEYSTORE_PASSWORD: ${{ secrets.ADMIN_KEYSTORE_PASSWORD }}
          ADMIN_KEY_PASSWORD: ${{ secrets.ADMIN_KEY_PASSWORD }}
          ADMIN_KEY_ALIAS: ${{ secrets.ADMIN_KEY_ALIAS }}
        run: |
          DEFAULT_B64=""
          B64="${ADMIN_KEYSTORE_B64:-$DEFAULT_B64}"
          SPASS="${ADMIN_KEYSTORE_PASSWORD:-nexora2026}"
          KPASS="${ADMIN_KEY_PASSWORD:-nexora2026}"
          KALIAS="${ADMIN_KEY_ALIAS:-nexora-upload}"
          echo "$B64" | base64 -d > android/app/license-admin.jks
          cat > android/key.properties <<EOF
          storeFile=license-admin.jks
          storePassword=$SPASS
          keyPassword=$KPASS
          keyAlias=$KALIAS
          storeType=PKCS12
          EOF
          # تحقق مبكر: إن تعذّر فتح المفتاح نفشل هنا برسالة واضحة بدل فشل
          # غامض داخل Gradle («Given final block not properly padded»).
          keytool -list -v -keystore android/app/license-admin.jks \
            -storepass "$SPASS" -alias "$KALIAS" \
            | grep -E "Owner|Entry type"
          echo "تم تجهيز مفتاح التوقيع الثابت"

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure admin_updater.dart matches pubspec.yaml
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          NAME="${VER%%+*}"; BUILD="${VER##*+}"
          IFS='.' read -r MAJ MIN PAT <<< "$NAME"
          sed -i "s/const String kAdminAppVersion = .*/const String kAdminAppVersion = '$NAME';/" lib/admin_updater.dart
          sed -i "s/const int kAdminAppBuild = .*/const int kAdminAppBuild = $BUILD;/" lib/admin_updater.dart
          sed -i "s/AdminSemVer([0-9]*, [0-9]*, [0-9]*, kAdminAppBuild)/AdminSemVer($MAJ, $MIN, $PAT, kAdminAppBuild)/" lib/admin_updater.dart
          echo "Verified admin_updater.dart matches $NAME+$BUILD"

      - name: Static analysis (flutter analyze)
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: "Build APK (arm64 modern + armv7 old)"
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --obfuscate --split-debug-info=build/app/symbols \
            --dart-define=ADMIN_REFRESH_TOKEN=${{ secrets.ADMIN_REFRESH_TOKEN }}
          cp build/app/outputs/apk/release/app-arm64-v8a-release.apk ../license-admin.apk
          cp build/app/outputs/apk/release/app-armeabi-v7a-release.apk ../license-admin-armv7.apk
          ls -lh ../license-admin.apk ../license-admin-armv7.apk

      - name: Generate admin version manifest (admin_version.json)
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          NAME="${VER%%+*}"; BUILD="${VER##*+}"
          SHA_ARM64=$(sha256sum ../license-admin.apk | awk '{print $1}')
          SHA_ARMV7=$(sha256sum ../license-admin-armv7.apk | awk '{print $1}')
          NOTES=$(python3 -c "import json,os; p='release_notes.txt'; lines=[l.strip() for l in open(p,encoding='utf-8').read().splitlines() if l.strip()] if os.path.exists(p) else ['تحديث تطبيق تراخيص المحاسب']; lines=lines[:3]; t='\\n'.join(lines); print(json.dumps(t,ensure_ascii=False)[1:-1])")
          cat > ../admin_version.json <<EOF
          {
            "version": "$NAME+$BUILD",
            "sha256": "$SHA_ARM64",
            "sha256Variants": {
              "arm64": "$SHA_ARM64",
              "armv7": "$SHA_ARMV7"
            },
            "releaseUrl": "https://github.com/${{ github.repository }}/releases/tag/admin-latest",
            "downloads": {
              "android": "https://github.com/${{ github.repository }}/releases/download/admin-latest/license-admin.apk",
              "androidVariants": {
                "arm64": "https://github.com/${{ github.repository }}/releases/download/admin-latest/license-admin.apk",
                "armv7": "https://github.com/${{ github.repository }}/releases/download/admin-latest/license-admin-armv7.apk"
              }
            },
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "$NOTES"
          }
          EOF
          cat ../admin_version.json
          curl -s -X PUT -H "Content-Type: application/json; charset=utf-8" -d @../admin_version.json "https://nexora-broker-default-rtdb.europe-west1.firebasedatabase.app/system/admin_version_manifest.json" || true
          curl -s -X PUT -H "Content-Type: application/json; charset=utf-8" -d @../admin_version.json "https://nexora-broker-default-rtdb.europe-west1.firebasedatabase.app/workspaces/_registry/system/admin_version_manifest.json" || true
          curl -s -X PUT -H "Content-Type: application/json; charset=utf-8" -d @../admin_version.json "https://nexora-ledger-default-rtdb.europe-west1.firebasedatabase.app/workspaces/_registry/system/admin_version_manifest.json" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: license-admin-apk
          path: |
            license-admin.apk
            license-admin-armv7.apk
            admin_version.json
          retention-days: 30

      - name: Attach to admin release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: admin-latest
          name: 🔑 تراخيص المحاسب — أحدث إصدار (للمالك فقط)
          body: |
            ## ⚠️ تطبيق خاص بمالك النظام فقط — لا يوزَّع للعملاء

            ### 📱 نسختان فقط حسب نوع الهاتف:
            1. **للهواتف الحديثة (64-بت):** حمّل **`license-admin.apk`** *(متوافقة مع أحدث إصدارات أندرويد)*.
            2. **للهواتف القديمة (32-بت):** حمّل **`license-admin-armv7.apk`**.
          files: |
            license-admin.apk
            license-admin-armv7.apk
            admin_version.json
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
