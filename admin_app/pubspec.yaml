publish_to: 'none'
version: 1.6.3+36

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  intl: '>=0.19.0 <1.0.0'
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <6.0.0'

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  adaptive_icon_background: "#4C1D95"
  adaptive_icon_foreground: "assets/icons/admin_foreground.png"
